name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sops: sops-v3.13.3.linux.amd64
            sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          - os: macos-latest
            sops: sops-v3.13.3.darwin.arm64
            sha256: b97c0d434aab577dc40310e8d22ff9e45eef4c80638ab978daae9b4681c59286
          - os: windows-latest
            sops: sops-v3.13.3.amd64.exe
            sha256: a4a9a398858fe8b2ef72d9686d930bf7c5cece9be74ad83ac3b53cfdd70e6b1c
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The sops CLI is only used by the compatibility tests; sopsy never calls it.
      - name: Install sops CLI for compatibility tests
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/${{ matrix.sops }}" \
            "https://github.com/getsops/sops/releases/download/v3.13.3/${{ matrix.sops }}"
          sum=sha256sum; command -v sha256sum >/dev/null || sum="shasum -a 256"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/${{ matrix.sops }}" | $sum -c -
          target="$RUNNER_TEMP/bin/sops"
          [ "$RUNNER_OS" = Windows ] && target="$target.exe"
          mv "$RUNNER_TEMP/${{ matrix.sops }}" "$target"
          chmod +x "$target"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: go vet ./...
      - run: go test ./...
        env:
          SOPSY_REQUIRE_SOPS: "1"

      # The real binary on a fresh, isolated home: init -> set -> run.
      - name: End-to-end
        run: |
          set -euo pipefail
          e2e="$RUNNER_TEMP/e2e"
          bin="$e2e/sopsy"; [ "$RUNNER_OS" = Windows ] && bin="$bin.exe"
          go build -o "$bin" .
          mkdir -p "$e2e/project" && cd "$e2e/project"
          export HOME="$e2e/home" APPDATA="$e2e/appdata"
          unset XDG_CONFIG_HOME SOPS_AGE_KEY_FILE
          value="e2e-value-$GITHUB_RUN_ID"

          "$bin" init
          printf '%s\n' "$value" | "$bin" set E2E_VALUE 2> set.err
          out=$("$bin" run -- printenv E2E_VALUE 2> run.err)
          test "$out" = "$value"
          "$bin" keys | grep -qx E2E_VALUE
          if grep -q "$value" set.err run.err; then echo "sopsy printed the value"; exit 1; fi
          # init put the key where a bare sops finds it, without any variable.
          sops decrypt --input-type dotenv --output-type dotenv secrets.env | grep -qx "E2E_VALUE=$value"

      - name: End-to-end in PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $e2e = Join-Path $env:RUNNER_TEMP 'e2e'
          $env:APPDATA = Join-Path $e2e 'appdata'
          Set-Location (Join-Path $e2e 'project')
          $out = & (Join-Path $e2e 'sopsy.exe') run -- pwsh -NoProfile -Command '(Get-ChildItem env:E2E_VALUE).Value'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -ne "e2e-value-$env:GITHUB_RUN_ID") { Write-Error 'value did not reach the child'; exit 1 }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
