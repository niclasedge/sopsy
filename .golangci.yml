version: "2"
linters:
  default: standard
  enable:
    - gosec
    - misspell
  settings:
    gosec:
      excludes:
        - G204 # running user-given commands is what `sopsy run` does
        - G301 # project directories are not secret
        - G304 # reading user-given paths is what a CLI does
        - G302 # encrypted files and .sops.yaml are meant to be committed
        - G306 # same, for os.WriteFile
  exclusions:
    rules:
      - path: _test\.go|internal/testutil/
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/niclasedge/sopsy
