name: sopsy-world
version: "0.1.0"
taxonomy: world
purpose: "The sopsy repo: where things live, how work flows, how the state is derived."
files:
  - path: world.md
    role: orientation
    summary: "Identity, routes and coverage map."
  - path: boundaries.md
    role: boundaries
    summary: "What this world does not know or decide."
  - path: workflow.md
    role: world
    summary: "Workflow: issue to OpenSpec change to PR, manual checks, public repo hygiene, conventions."
  - path: test.md
    role: world
    summary: "Testing: no-secret harness, isolation, sops compatibility, test-only key, web UI tests, test style."
  - path: code.md
    role: world
    summary: "Code layout: packages, platform code, key lookup, errors and exit codes."
  - path: stack.md
    role: world
    summary: "Software stack: libraries, tooling and CI, dependencies."
  - path: deploy.md
    role: world
    summary: "Release: dry run, tagging, version stamping."
  - path: build.md
    role: world
    summary: "Build commands and source locations."
